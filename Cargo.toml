[package]
name = "hypr_zoomer"
version = "0.1.0"
edition = "2024"
description = "High performance wayland screen magnification, zoom, and live presentation annotation tool."
license = "MIT"
authors = ["BayonetArch <sudipxd124@gmail.com>"]
repository = "https://github.com/BayonetArch/hypr_zoomer"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
softbuffer = "0.4.8"
tiny-skia = "0.12.0"
toml = "1.1.4"
winit = "0.30.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

